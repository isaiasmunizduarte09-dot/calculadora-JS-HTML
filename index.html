<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Interativa - JavaScript na Prática</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100 d-flex align-items-center py-4">

    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h1 class="h4 card-title mb-4 text-center text-primary">Calculadora JS</h1>

                        <form id="calcForm" class="row g-3">
                            <div class="col-6">
                                <label for="v1" class="form-label">Valor A</label>
                                <input type="number" id="v1" class="form-control" placeholder="0" required>
                            </div>

                            <div class="col-6">
                                <label for="v2" class="form-label">Valor B</label>
                                <input type="number" id="v2" class="form-control" placeholder="0" required>
                            </div>

                            <div class="col-12">
                                <label for="oper" class="form-label">Operação</label>
                                <select id="oper" class="form-select">
                                    <option value="0">Soma</option>
                                    <option value="1">Subtração</option>
                                    <option value="2">Multiplicação</option>
                                    <option value="3">Divisão</option>
                                    <option value="4">Exponencial</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <button type="button" class="btn btn-primary w-100 mt-2" onclick="executar()">
                                    Calcular
                                </button>
                            </div>
                        </form>

                        <div id="resp" class="alert alert-secondary mt-4 mb-0 text-center" role="alert">
                            O resultado aparecerá aqui.
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="codigo.js"></script>
    <script>
        const executar = () => {
            const inputA = document.getElementById("v1").value;
            const inputB = document.getElementById("v2").value;
            const operacao = parseInt(document.getElementById("oper").value, 10);
            const elementoResp = document.getElementById("resp");

            // Validação de campos vazios
            if (inputA === "" || inputB === "") {
                elementoResp.className = "alert alert-warning mt-4 mb-0 text-center";
                elementoResp.innerHTML = "Por favor, preencha ambos os valores.";
                return;
            }

            const a = Number(inputA);
            const b = Number(inputB);
            let resultado;

            switch (operacao) {
                case 0:
                    resultado = soma(a, b);
                    break;
                case 1:
                    resultado = subtracao(a, b);
                    break;
                case 2:
                    resultado = multiplicacao(a, b);
                    break;
                case 3:
                    resultado = dividir(a, b);
                    break;
                case 4:
                    resultado = exponencial(a, b);
                    break;
                default:
                    resultado = "Operação inválida";
            }

            elementoResp.className = "alert alert-success mt-4 mb-0 text-center";
            elementoResp.innerHTML = `O resultado da operação é <strong>${resultado}</strong>`;
        };
    </script>
</body>
</html>
